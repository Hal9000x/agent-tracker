name: Release

# Pushing a v* tag tests and builds Agent Tracker on Windows, macOS and Linux and
# publishes a GitHub pre-release with one download per system.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            system: windows-x64
          - os: macos-latest
            system: macos-universal
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: ubuntu-latest
            system: linux-x64
            targets: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build the UI
        run: npm --prefix web ci && npm --prefix web run build
      - name: Test
        run: npm test

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          cargo build --release --manifest-path daemon/Cargo.toml
          mkdir -p pkg/agent-tracker && cp daemon/target/release/agent-tracker.exe pkg/agent-tracker/
      - name: Build (macOS, Apple silicon and Intel in one binary)
        if: runner.os == 'macOS'
        run: |
          cargo build --release --manifest-path daemon/Cargo.toml --target aarch64-apple-darwin
          cargo build --release --manifest-path daemon/Cargo.toml --target x86_64-apple-darwin
          mkdir -p pkg/agent-tracker
          lipo -create -output pkg/agent-tracker/agent-tracker \
            daemon/target/aarch64-apple-darwin/release/agent-tracker daemon/target/x86_64-apple-darwin/release/agent-tracker
      - name: Build (Linux, statically linked)
        if: runner.os == 'Linux'
        run: |
          cargo build --release --manifest-path daemon/Cargo.toml --target x86_64-unknown-linux-musl
          mkdir -p pkg/agent-tracker && cp daemon/target/x86_64-unknown-linux-musl/release/agent-tracker pkg/agent-tracker/

      - name: Package
        run: |
          cp TESTERS.md pkg/agent-tracker/
          name="agent-tracker-${GITHUB_REF_NAME}-${{ matrix.system }}"
          if [ "$RUNNER_OS" = Windows ]; then
            (cd pkg && 7z a "../$name.zip" agent-tracker)
          else
            tar -czf "$name.tar.gz" -C pkg agent-tracker
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.system }}
          path: agent-tracker-*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Agent Tracker $GITHUB_REF_NAME" \
            --notes "Download the file for your system, unpack it, and follow TESTERS.md inside."
